<!DOCTYPE html>
<html>
<head>
    <title>Hitmen Uploader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>🔥 Hitmen Uploader 🔥</h1>
    <a href="{{ url_for('upload') }}">Upload New File</a>
    <hr>
    {% for upload in uploads %}
        <div class="upload-card">
            <h3>{{ upload[1] }} uploaded:</h3>
            <p><img src="{{ url_for('static', filename='uploads/' + upload[2]) }}" width="300"></p>
            <p>❤️ Likes: {{ upload[3] }}</p>
            <form action="{{ url_for('like', upload_id=upload[0]) }}" method="get">
                <button type="submit">Like</button>
            </form>
            <form action="{{ url_for('comment', upload_id=upload[0]) }}" method="post">
                <input type="text" name="comment" placeholder="Add a comment" required>
                <button type="submit">Comment</button>
            </form>
            <pre>{{ upload[4] }}</pre>
            <hr>
        </div>
    {% endfor %}
</body>
</html>
